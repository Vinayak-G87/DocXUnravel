[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docxunravel"
version = "0.4.0"
description = "Deterministic, lossless DOCX profiling and semantic template automation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "lxml>=5,<7",
  "python-docx>=1.1.2,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
visual = [
  "Pillow>=10,<14",
  "PyMuPDF>=1.24,<2",
]
mcp = [
  "mcp>=2.3,<3",
  "PyJWT[crypto]>=2.10,<3",
]
dev = [
  "Pillow>=10,<14",
  "PyMuPDF>=1.24,<2",
  "mcp>=2.3,<3",
  "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
docxunravel = "docxunravel.cli:main"
docxunravel-mcp = "docxunravel.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docxunravel = ["schemas/*.json"]

